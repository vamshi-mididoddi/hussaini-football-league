# Mirror the live score store into data/live.json so the site always has a
# validated fallback copy, even if the store disappears.
#
# An unreachable store is an expected condition (anonymous stores expire), so
# it skips quietly instead of failing the run — a failed run emails the owner
# every 15 minutes, which is worse than the missing mirror.
name: Mirror live scores

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency: mirror-scores

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mirror if the store is reachable
        run: |
          STORE="https://jsonblob.com/api/jsonBlob/019fe5c0-1e59-7d7a-ba5c-c6b88420c697"
          if ! curl -fsS --max-time 30 "$STORE" -H "Accept: application/json" -o /tmp/live-raw.json; then
            echo "::warning::Score store unreachable — nothing mirrored this run."
            exit 0
          fi
          node tools/validate-live.js /tmp/live-raw.json data/live.json
          if ! git diff --quiet data/live.json; then
            git config user.name "hfl-scorebot"
            git config user.email "scorebot@users.noreply.github.com"
            git add data/live.json
            git commit -m "Mirror live scores"
            git push
          else
            echo "No change."
          fi
